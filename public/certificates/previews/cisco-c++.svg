<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#049fd9"/>
      <stop offset="50%" stop-color="#1ba0d7"/>
      <stop offset="100%" stop-color="#005073"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f9d77e"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="850" fill="url(#bgGrad)"/>

  <!-- Ornate Border -->
  <rect x="30" y="30" width="1140" height="790" rx="8" fill="none" stroke="url(#borderGrad)" stroke-width="12"/>
  <rect x="48" y="48" width="1104" height="754" rx="4" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="56" y="56" width="1088" height="738" rx="2" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Corner Accents -->
  <circle cx="30" cy="30" r="16" fill="#049fd9"/>
  <circle cx="1170" cy="30" r="16" fill="#049fd9"/>
  <circle cx="30" cy="820" r="16" fill="#049fd9"/>
  <circle cx="1170" cy="820" r="16" fill="#049fd9"/>

  <!-- Header Badge & Logo -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Cisco-inspired Bridge Bars -->
    <g fill="#049fd9">
      <rect x="-40" y="-45" width="6" height="28" rx="3"/>
      <rect x="-24" y="-55" width="6" height="38" rx="3"/>
      <rect x="-8" y="-65" width="6" height="48" rx="3"/>
      <rect x="8" y="-65" width="6" height="48" rx="3"/>
      <rect x="24" y="-55" width="6" height="38" rx="3"/>
      <rect x="40" y="-45" width="6" height="28" rx="3"/>
    </g>
    <text y="-8" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#005073" letter-spacing="4">CISCO</text>
    <text y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="3">Networking Academy</text>
  </g>

  <!-- Title -->
  <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI', Roboto, serif" font-size="34" font-weight="700" fill="#1e293b" letter-spacing="1">
    CERTIFICATE OF COMPLETION
  </text>
  <line x1="450" y1="260" x2="750" y2="260" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <text x="600" y="310" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#64748b" letter-spacing="1.5">
    THIS IS TO CERTIFY THAT
  </text>

  <!-- Recipient Name -->
  <text x="600" y="380" text-anchor="middle" font-family="'Segoe UI', Roboto, serif" font-size="44" font-weight="800" fill="#049fd9" letter-spacing="1">
    Sachin Kumar
  </text>
  <line x1="380" y1="405" x2="820" y2="405" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Description -->
  <text x="600" y="450" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#475569">
    has successfully completed the Cisco Networking Academy course
  </text>

  <!-- Course Title -->
  <rect x="360" y="480" width="480" height="52" rx="26" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="600" y="513" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#0369a1">
    C++ Essentials - Part 1
  </text>

  <text x="600" y="570" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#64748b">
    Demonstrating proficiency in fundamentals of C++ programming, data types, logic control, and memory structures.
  </text>

  <!-- Bottom Section: Verification & Signatures -->
  <!-- Left: Date -->
  <g transform="translate(220, 680)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="110" y="24" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1e293b">23rd July 2025</text>
    <text x="110" y="44" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Date Issued</text>
  </g>

  <!-- Center: Gold Seal -->
  <g transform="translate(600, 680)">
    <circle cx="0" cy="-10" r="44" fill="url(#goldGrad)" filter="drop-shadow(0 4px 12px rgba(170, 124, 17, 0.35))"/>
    <circle cx="0" cy="-10" r="38" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2"/>
    <text y="-14" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#713f12" letter-spacing="1">VERIFIED</text>
    <text y="0" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#713f12">★ CISCO ★</text>
    <text y="14" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#713f12">ACADEMY</text>
  </g>

  <!-- Right: Instructor/Academy -->
  <g transform="translate(760, 680)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="110" y="24" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Laura Quint</text>
    <text x="110" y="44" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">VP &amp; General Manager, Cisco Networking Academy</text>
  </g>
</svg>
