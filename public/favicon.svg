<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="badgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="85%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Metallic outer chassis -->
  <circle cx="50" cy="50" r="48" fill="url(#badgeBg)" stroke="#334155" stroke-width="2"/>
  <!-- Glowing orbit ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" opacity="0.85"/>
  <ellipse cx="50" cy="50" rx="46" ry="24" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" transform="rotate(-25 50 50)"/>
  <!-- Circuit node dots -->
  <circle cx="20" cy="50" r="2" fill="#38bdf8"/>
  <circle cx="80" cy="50" r="2" fill="#ec4899"/>
  <circle cx="50" cy="12" r="1.8" fill="#38bdf8"/>
  <circle cx="50" cy="88" r="1.8" fill="#a855f7"/>
  <!-- Letters S and K -->
  <text x="32" y="60" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="url(#sGrad)">S</text>
  <text x="66" y="60" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="url(#kGrad)">K</text>
</svg>
